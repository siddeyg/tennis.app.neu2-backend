name: Backend Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # jest.env.setup.js loads .env.development — provide CI-safe values here
      # These are test-only values, NOT production secrets
      - name: Create .env.development for CI
        run: |
          cat > .env.development << 'EOF'
          NODE_ENV=test
          PORT=5000
          MONGO_URI=mongodb://localhost:27017/test
          JWT_SECRET=ci-test-jwt-secret-256bit-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          REFRESH_TOKEN_SECRET=ci-test-refresh-secret-256bit-bbbbbbbbbbbbbbbbbbbbbbbb
          PORTAL_JWT_SECRET=ci-test-portal-jwt-secret-256bit-cccccccccccccccccccccccc
          PORTAL_REFRESH_TOKEN_SECRET=ci-test-portal-refresh-256bit-dddddddddddddddddddddddd
          JWT_EXPIRES_IN=8h
          REFRESH_EXPIRES_IN=30d
          IBAN_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CORS_ORIGIN=http://localhost:3000
          USE_TRANSACTIONS=false
          ENABLE_NOTIFICATIONS=false
          FROM_EMAIL=test@example.com
          FROM_NAME=Test
          FRONTEND_URL=http://localhost:3001
          PORTAL_URL=http://localhost:3001
          EOF

      - name: Run tests
        run: node --experimental-vm-modules node_modules/.bin/jest --no-coverage --runInBand
        # --runInBand: run serially — parallel MongoMemoryServer instances exhaust CI memory
        # see docs/testing/TEST_RUN_ANALYSIS_2026-03-06.md
